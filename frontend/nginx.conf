server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA client-side routing fallback
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed static assets
    location /assets/ {
        # Included again rather than inherited from the server block: the
        # Cache-Control below would discard the inherited set. See the snippet.
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA client-side routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

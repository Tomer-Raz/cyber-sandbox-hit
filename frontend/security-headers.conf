# Included from every location block instead of being set once on the server.
# nginx's add_header does not merge: a location that adds a header of its own
# replaces the entire inherited set rather than extending it. /assets/ adds a
# Cache-Control, so setting these at server level would silently ship the
# static bundle — the most valuable thing to hijack — with no policy at all.
#
# __API_ORIGIN__ is substituted at image build time from VITE_API_BASE_URL, the
# same value the bundle is compiled against (see Dockerfile). Deriving it from
# one source is what stops the policy and the URL the SPA actually calls from
# drifting apart, and keeps the domain out of the repo.
#
# Notes on the loose ends:
#   style-src 'unsafe-inline' — antd is CSS-in-JS and injects <style> at
#     runtime. There is no nonce to hand it, so this is not removable without
#     changing how the UI is styled.
#   accounts.google.com — Google Identity Services. It loads gsi/client, its
#     stylesheet, and renders the sign-in button in an iframe of its own.

add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: https://accounts.google.com; font-src 'self'; connect-src 'self' __API_ORIGIN__ https://accounts.google.com; frame-src https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# same-origin-allow-popups, not same-origin: the Google sign-in popup needs to
# postMessage its result back to the window that opened it.
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
add_header Permissions-Policy "accelerometer=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

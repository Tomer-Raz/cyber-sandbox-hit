<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%231677ff' d='M16 2 4 7v8c0 7.5 5.1 13 12 15 6.9-2 12-7.5 12-15V7L16 2Z'/%3E%3Cpath fill='%23ffffff' d='m14.7 19.6-3.6-3.6 1.8-1.8 1.8 1.8 4.6-4.6 1.8 1.8-6.4 6.4Z'/%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1677ff" />
    <meta
      name="description"
      content="Sandbox Playground — AI-driven automated penetration testing console."
    />
    <title>Sandbox Playground · Cyber Console</title>
    <script>
      // Paint the correct background before React mounts, otherwise dark-mode
      // users get a white flash. ThemeProvider takes over with real antd tokens.
      ;(function () {
        try {
          var stored = localStorage.getItem('sbx.theme')
          var dark =
            stored === 'dark' ||
            ((stored === 'system' || !stored) &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          var root = document.documentElement
          root.style.colorScheme = dark ? 'dark' : 'light'
          root.dataset.theme = dark ? 'dark' : 'light'
          root.style.backgroundColor = dark ? '#000' : '#f5f5f5'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
